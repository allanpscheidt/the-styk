name: Security regression checks

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run isolated security regressions
        run: bash tests/run_security_tests.sh
      - name: Compile both supported macOS architectures
        run: |
          mkdir -p build
          swiftc -swift-version 5 -target arm64-apple-macos11.0 Sources/*.swift -o build/TheStyk-arm64
          swiftc -swift-version 5 -target x86_64-apple-macos10.15 Sources/*.swift -o build/TheStyk-x86_64

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Run storage and focus regressions
        run: python3 -m unittest discover -s tests -p 'test_linux_security.py' -v

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: '8.0.x'
      - name: Compile Windows application
        run: dotnet build TheStyk-Windows/TheStyk-Windows/TheStyk-Windows.csproj -c Release
      - name: Check observer log removal
        run: python -m unittest discover -s tests -p 'test_windows_privacy.py' -v
